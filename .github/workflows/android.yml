name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          ls "$SDK/platforms" "$SDK/build-tools"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Check ledger calculations
        run: |
          mkdir -p /tmp/ledger-test
          javac -encoding UTF-8 -d /tmp/ledger-test app/src/main/java/ru/personal/alfafinance/Ledger.java app/src/main/java/ru/personal/alfafinance/CategoryCatalog.java tests/LedgerSmoke.java tests/CategorySmoke.java app/src/main/java/ru/personal/alfafinance/BankStatement.java app/src/main/java/ru/personal/alfafinance/BankRules.java tests/StatementSmoke.java app/src/main/java/ru/personal/alfafinance/MccCatalog.java app/src/main/java/ru/personal/alfafinance/ReportPeriod.java tests/AnalyticsSmoke.java
          java -cp /tmp/ledger-test ru.personal.alfafinance.LedgerSmoke
          java -cp /tmp/ledger-test ru.personal.alfafinance.CategorySmoke
          java -cp /tmp/ledger-test ru.personal.alfafinance.StatementSmoke
          java -cp /tmp/ledger-test ru.personal.alfafinance.AnalyticsSmoke
          python3 tests/check_icons.py
      - name: Cache development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: myfinances-debug-signing-v1
      - run: gradle :app:assembleDebug --no-daemon
      - name: Report APK size
        run: du -h app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyFinances-APK
          path: app/build/outputs/apk/debug/app-debug.apk
